# leitwacht-agent CI
#
# Stages:
#   lint     gofmt + go vet on every push.
#   test     `go test ./...` (Linux only — most code is build-tagged).
#   build    Container images (agent-ce, leitwacht-initc) built with
#            Kaniko, tagged with the standard semver-ladder + commit
#            sha + branch tags, and pushed to the GitLab Container
#            Registry that ships with this project. amd64-only for v1;
#            arm64 follows once eBPF artefacts exist for arm64.
#   sign     cosign keyless signing via GitLab's OIDC token, attestation
#            published to the public Rekor transparency log.
#   sbom     SPDX SBOM generated by syft, attached as a cosign
#            attestation alongside the signed image.
#   mirror   On semver tags only: copy the signed images + attestations
#            to quay.io/leitwacht/{agent-ce,leitwacht-initc} so security-
#            conscious consumers have a no-rate-limit alternative to GitLab.
#
# Tag scheme (per release tag vX.Y.Z, with X.Y.Z = '1.2.3'):
#   :v1.2.3, :1.2.3, :1.2, :1, :latest
# Per-branch:
#   :main, :sha-${CI_COMMIT_SHORT_SHA}
# Pre-release tags (vX.Y.Z-rc1) skip the moving :latest / :1 / :1.2 tags
# and only get the exact :v1.2.3-rc1 tag.

stages:
  - lint
  - test
  - release
  - build
  - sign
  - sbom
  - mirror

variables:
  GO_VERSION: "1.26"
  REGISTRY: "${CI_REGISTRY_IMAGE}"
  INITC_IMAGE: "${CI_REGISTRY_IMAGE}/leitwacht-initc"
  AGENT_CE_IMAGE: "${CI_REGISTRY_IMAGE}/agent-ce"
  # buildctl client (the persistent rootful buildkitd lives in the
  # cluster; CI talks to it over gRPC, see .build_image stage).
  # Pin-by-tag for now; switch to digest pin once dogfood proves stable.
  BUILDKIT_IMAGE: "moby/buildkit:v0.18.2"
  BUILDKITD_ADDR: "tcp://buildkitd.buildkitd-cerberus-iot.svc.cluster.local:1234"
  # Quay.io mirror destinations (set via project secrets QUAY_USER /
  # QUAY_TOKEN). Empty values disable the mirror stage.
  QUAY_INITC_IMAGE: "quay.io/leitwacht/leitwacht-initc"
  QUAY_AGENT_CE_IMAGE: "quay.io/leitwacht/agent-ce"
  # go-semantic-release pinned binary. Bump together — the SHA256 has
  # to match the release artefact at SEMREL_VERSION on GitHub.
  SEMREL_VERSION: "v2.31.0"
  SEMREL_SHA256: "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3"

default:
  image: golang:${GO_VERSION}

# ---------------------------------------------------------------- LINT
lint:
  stage: lint
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)" || (echo "gofmt found issues — run 'gofmt -w .' locally"; gofmt -l .; exit 1)

# Re-run `go generate ./agentcore/enforcer/...` and fail if the regenerated
# eBPF .o files or bpf2go-emitted .go bindings differ from what's committed.
# Forces eBPF C-source edits to land alongside their regenerated artefacts.
# Pinned to bookworm (clang 14, llvm-strip from llvm) for byte-reproducible
# output — local regen with a different toolchain will mismatch on purpose.
check-ebpf-drift:
  stage: lint
  image: golang:${GO_VERSION}-bookworm
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends clang libbpf-dev llvm
    - make check-ebpf-drift

# ---------------------------------------------------------------- TEST
test:
  stage: test
  script:
    - go test -race -count=1 -tags=linux ./...

# ------------------------------------------------------------ RELEASE
# go-semantic-release reads conventional commits since the last tag,
# computes the next semver, creates the git tag and the GitLab Release
# via the gitlab provider. The tag push triggers a *new* pipeline that
# fans out to build / sign / sbom / mirror — see the rules: $CI_COMMIT_TAG
# blocks below.
#
# Requires a project access token with `api` + `write_repository` scopes
# exposed as GITLAB_TOKEN (masked + protected). The default $CI_JOB_TOKEN
# cannot push tags on gitlab.com SaaS.
semantic-release:
  stage: release
  image: alpine:3.20
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache curl ca-certificates git
    - |
      SEMREL_URL="https://github.com/go-semantic-release/semantic-release/releases/download/${SEMREL_VERSION}/semantic-release_${SEMREL_VERSION}_linux_amd64"
      curl -fSL "$SEMREL_URL" -o /usr/local/bin/semantic-release
      echo "${SEMREL_SHA256}  /usr/local/bin/semantic-release" | sha256sum -c -
      chmod +x /usr/local/bin/semantic-release
    - semantic-release --version
    - git config user.name "gitlab-ci"
    - git config user.email "security@leitwacht.eu"
  script:
    - |
      export GITLAB_BASE_URL="https://gitlab.com"
      semantic-release \
        --provider=gitlab \
        --provider-opt="slug=${CI_PROJECT_PATH}" \
        --allow-initial-development-versions \
        --allow-no-changes \
        --changelog="CHANGELOG.md" \
        --update="ce/helm/agent-ce/Chart.yaml"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"

# --------------------------------------------------------------- BUILD
# buildctl client → persistent in-cluster buildkitd at BUILDKITD_ADDR.
# The buildkitd instance is observed by the leitwacht egress agent
# (BuildKit step-attribution), so every RUN-step's egress in our own
# image builds attributes to the CI job that ran it — dogfood path
# for the BuildKit attribution feature.
#
# Auth: buildctl forwards the client's ~/.docker/config.json to
# buildkitd over the session multiplexer; buildkitd uses it for
# registry pushes. No buildkitd-side credential mount needed.
#
# Each image is built in parallel and gets the full tag ladder. The
# sha-X tag is always pushed; moving tags (:latest, :main, :1, :1.2)
# are pushed conditionally — see the rules block.

.build_image:
  stage: build
  image:
    name: ${BUILDKIT_IMAGE}
    entrypoint: [""]
  script:
    # Resolve the tag set we'll push. CI_COMMIT_TAG is set on git tags;
    # everything else is a branch build. Pre-release tags (e.g.
    # v1.2.3-rc1) get only the exact tag; release tags fan out to the
    # semver ladder.
    - |
      set -eu

      # buildctl's --output type=image accepts a comma-separated
      # name list inside a quoted "name=..." field. Build the list
      # now; the quoting in the buildctl invocation below preserves
      # the commas as part of the field value.
      DEST_NAMES="${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # Strip leading 'v' if present.
        VERSION="${CI_COMMIT_TAG#v}"
        DEST_NAMES="${DEST_NAMES},${IMAGE}:${CI_COMMIT_TAG}"
        DEST_NAMES="${DEST_NAMES},${IMAGE}:${VERSION}"
        case "${VERSION}" in
          *-*) ;;  # pre-release: skip moving tags
          *)
            MAJOR_MINOR="${VERSION%.*}"
            MAJOR="${MAJOR_MINOR%.*}"
            DEST_NAMES="${DEST_NAMES},${IMAGE}:${MAJOR_MINOR}"
            DEST_NAMES="${DEST_NAMES},${IMAGE}:${MAJOR}"
            DEST_NAMES="${DEST_NAMES},${IMAGE}:latest"
            ;;
        esac
      elif [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        DEST_NAMES="${DEST_NAMES},${IMAGE}:main"
      fi

      VERSION_LDFLAG="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

      mkdir -p /root/.docker
      cat > /root/.docker/config.json <<EOF
      {"auths":{"${CI_REGISTRY}":{"auth":"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"}}}
      EOF

      # CI metadata as build-args. The leitwacht egress agent reads
      # these from each Solve session's FrontendAttrs and attributes
      # every RUN-step's egress to this exact CI job. Matches the
      # tools/leitwacht-buildx wrapper used for developer-side
      # `docker buildx build` invocations.
      CI_BUILD_ARGS=""
      for pair in CI_PROJECT_PATH:LEITWACHT_CI_PROJECT_PATH \
                  CI_JOB_ID:LEITWACHT_CI_JOB_ID \
                  CI_PIPELINE_ID:LEITWACHT_CI_PIPELINE_ID \
                  CI_JOB_NAME:LEITWACHT_CI_JOB_NAME \
                  CI_JOB_STAGE:LEITWACHT_CI_JOB_STAGE \
                  CI_COMMIT_REF_NAME:LEITWACHT_CI_GIT_REF \
                  CI_JOB_URL:LEITWACHT_CI_JOB_URL \
                  CI_PIPELINE_SOURCE:LEITWACHT_CI_PIPELINE_SOURCE; do
        src="${pair%%:*}"; dst="${pair##*:}"
        val="$(printenv "$src" || true)"
        if [ -n "$val" ]; then
          CI_BUILD_ARGS="$CI_BUILD_ARGS --opt build-arg:$dst=$val"
        fi
      done

      # Reproducible-ish output: SOURCE_DATE_EPOCH normalises layer
      # manifest timestamps. BuildKit has no exact equivalent of
      # Kaniko's --reproducible (which also normalises file mtimes
      # inside the rootfs); bit-exact reproducibility is weaker but
      # acceptable — the released image hash + cosign signature in
      # Rekor + the SBOM are the source-of-truth for verification.
      export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"

      # shellcheck disable=SC2086 # CI_BUILD_ARGS intentionally splits
      buildctl --addr "${BUILDKITD_ADDR}" build \
        --frontend dockerfile.v0 \
        --local context="${CI_PROJECT_DIR}" \
        --local dockerfile="${CI_PROJECT_DIR}" \
        --opt filename="${DOCKERFILE}" \
        --opt platform=linux/amd64 \
        --opt build-arg:VERSION="${VERSION_LDFLAG}" \
        --opt build-arg:COMMIT="${CI_COMMIT_SHORT_SHA}" \
        --opt build-arg:GO_VERSION="${GO_VERSION}" \
        --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
        $CI_BUILD_ARGS \
        --output "type=image,\"name=${DEST_NAMES}\",push=true"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        # MR pipelines push to a per-MR tag only, no moving tags.
        SKIP_MOVING_TAGS: "true"

build-leitwacht-initc:
  extends: .build_image
  variables:
    IMAGE: "${INITC_IMAGE}"
    DOCKERFILE: "Dockerfile.leitwacht-initc"

build-agent-ce:
  extends: .build_image
  variables:
    IMAGE: "${AGENT_CE_IMAGE}"
    DOCKERFILE: "Dockerfile.agent-ce"

# --------------------------------------------------------------- SIGN
# Keyless signing via GitLab's OIDC token. cosign requests a short-
# lived Fulcio certificate bound to the CI job's identity, signs the
# image, and writes the signature to Rekor for public verification.
# Verifiers later run:
#
#   cosign verify <image> \
#     --certificate-identity-regexp 'https://gitlab\.com/leitwacht/leitwacht-agent//\.gitlab-ci\.yml@refs/.*' \
#     --certificate-oidc-issuer https://gitlab.com
#
# No private key in the project; rotation is automatic.

.sign_image:
  stage: sign
  # alpine ships cosign in its community repo; using alpine instead of
  # gcr.io/projectsigstore/cosign because the upstream cosign image is
  # fully distroless (no shell), and GitLab Runner's k8s executor needs
  # /bin/sh inside the build container to host the script.
  image: alpine:3.21
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache cosign
  script:
    - cosign login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}"
    - cosign sign "${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        cosign sign "${IMAGE}:${CI_COMMIT_TAG}"
      fi
  rules:
    - if: $CI_COMMIT_TAG

sign-leitwacht-initc:
  extends: .sign_image
  variables:
    IMAGE: "${INITC_IMAGE}"
  needs: [build-leitwacht-initc]

sign-agent-ce:
  extends: .sign_image
  variables:
    IMAGE: "${AGENT_CE_IMAGE}"
  needs: [build-agent-ce]

# --------------------------------------------------------------- SBOM
# Generate an SPDX SBOM with syft and attach it as a cosign
# attestation. Downstream supply-chain audits can fetch it via:
#
#   cosign download attestation <image> --predicate-type spdxjson

.sbom_image:
  stage: sbom
  # alpine ships syft in its community repo; using alpine instead of
  # anchore/syft (also distroless) so the k8s executor has a shell.
  image: alpine:3.21
  variables:
    # syft reads these to authenticate against the GitLab Container
    # Registry when scanning the just-built image. cosign jobs handle
    # this via 'cosign login'; syft has its own env-var-driven flow.
    SYFT_REGISTRY_AUTH_AUTHORITY: "${CI_REGISTRY}"
    SYFT_REGISTRY_AUTH_USERNAME: "${CI_REGISTRY_USER}"
    SYFT_REGISTRY_AUTH_PASSWORD: "${CI_REGISTRY_PASSWORD}"
  before_script:
    - apk add --no-cache syft
  script:
    - syft --output spdx-json="${CI_PROJECT_DIR}/sbom.spdx.json" "registry:${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
  artifacts:
    paths:
      - sbom.spdx.json
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG

sbom-leitwacht-initc:
  extends: .sbom_image
  variables:
    IMAGE: "${INITC_IMAGE}"
  needs: [sign-leitwacht-initc]

sbom-agent-ce:
  extends: .sbom_image
  variables:
    IMAGE: "${AGENT_CE_IMAGE}"
  needs: [sign-agent-ce]

.attach_sbom:
  stage: sbom
  image: alpine:3.21
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apk add --no-cache cosign
  script:
    - cosign login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}"
    - cosign attest --predicate sbom.spdx.json --type spdxjson "${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_TAG

attach-sbom-leitwacht-initc:
  extends: .attach_sbom
  variables:
    IMAGE: "${INITC_IMAGE}"
  needs:
    - job: sbom-leitwacht-initc
      artifacts: true

attach-sbom-agent-ce:
  extends: .attach_sbom
  variables:
    IMAGE: "${AGENT_CE_IMAGE}"
  needs:
    - job: sbom-agent-ce
      artifacts: true

# ------------------------------------------------------------- MIRROR
# Tag-only: copy signed images + attestations from GitLab to Quay.io.
# Quay has no anonymous-pull rate limits and ships with security
# scanning, so security-conscious consumers prefer it.
#
# Requires QUAY_USER + QUAY_TOKEN as masked, protected project
# variables. If unset the stage no-ops.

.mirror_image:
  stage: mirror
  image:
    name: gcr.io/go-containerregistry/crane:v0.20.2
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG && $QUAY_TOKEN
  script:
    - crane auth login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}"
    - crane auth login quay.io -u "${QUAY_USER}" -p "${QUAY_TOKEN}"
    # Copy preserves all tags + signatures + attestations referenced
    # via OCI 1.1 referrers; cosign images and SBOMs ride along.
    - crane copy "${SRC_IMAGE}:${CI_COMMIT_TAG}" "${DST_IMAGE}:${CI_COMMIT_TAG}"
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      case "${VERSION}" in
        *-*) ;;
        *)
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"
          crane copy "${SRC_IMAGE}:${CI_COMMIT_TAG}" "${DST_IMAGE}:${VERSION}"
          crane copy "${SRC_IMAGE}:${CI_COMMIT_TAG}" "${DST_IMAGE}:${MAJOR_MINOR}"
          crane copy "${SRC_IMAGE}:${CI_COMMIT_TAG}" "${DST_IMAGE}:${MAJOR}"
          crane copy "${SRC_IMAGE}:${CI_COMMIT_TAG}" "${DST_IMAGE}:latest"
          ;;
      esac

mirror-leitwacht-initc:
  extends: .mirror_image
  variables:
    SRC_IMAGE: "${INITC_IMAGE}"
    DST_IMAGE: "${QUAY_INITC_IMAGE}"
  needs: [attach-sbom-leitwacht-initc]

mirror-agent-ce:
  extends: .mirror_image
  variables:
    SRC_IMAGE: "${AGENT_CE_IMAGE}"
    DST_IMAGE: "${QUAY_AGENT_CE_IMAGE}"
  needs: [attach-sbom-agent-ce]
