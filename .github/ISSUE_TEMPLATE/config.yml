blank_issues_enabled: false
contact_links:
  - name: File an issue on GitLab
    url: https://gitlab.com/leitwacht/leitwacht-agent/-/issues
    about: |
      This GitHub repository is a read-only mirror. All issues are tracked
      on GitLab — please file there. Issues opened on GitHub are not
      monitored and will be closed without review.
  - name: Report a security vulnerability
    url: https://gitlab.com/leitwacht/leitwacht-agent/-/blob/main/SECURITY.md
    about: |
      Do not file security issues in public. See SECURITY.md for the
      private reporting channel.
