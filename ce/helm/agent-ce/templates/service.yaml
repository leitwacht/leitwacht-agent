{{- if .Values.sinks.prometheus.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-ce.fullname" . }}-metrics
  labels:
    {{- include "agent-ce.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agent-ce.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
