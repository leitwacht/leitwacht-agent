{{- if not .Values.dnsUpstream -}}
{{- fail "values.dnsUpstream is required — set to your cluster DNS resolver (e.g., the kube-dns ClusterIP). See values.yaml for details." -}}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agent-ce.fullname" . }}
  labels:
    {{- include "agent-ce.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "agent-ce.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-ce.selectorLabels" . | nindent 8 }}
      annotations:
        # Force a rollout on rules.yaml change so older Helm versions
        # without the post-upgrade hook still pick up the new ConfigMap.
        checksum/rules: {{ .Values.rules | sha256sum }}
    spec:
      serviceAccountName: {{ include "agent-ce.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # hostPID: required for /proc/<pid>/ns/net netns inode lookup —
      # the agent walks PIDs in the host namespace to map a runner
      # container's PID to its netns. Removing this breaks enforcement
      # silently (the watcher fires events but the enforcer can't
      # resolve cgroups).
      hostPID: true
      hostNetwork: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-ce
          image: {{ include "agent-ce.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true              # eBPF + nftables require privileged today
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - BPF
                - PERFMON
          env:
            - name: LEITWACHT_CE_RULES_PATH
              value: /etc/leitwacht/rules.yaml
            - name: LEITWACHT_CE_CONTAINER_RUNTIME
              value: {{ .Values.runtime | quote }}
            {{- if eq .Values.runtime "containerd" }}
            - name: LEITWACHT_CE_CONTAINER_SOCKET
              value: {{ .Values.containerd.socket | quote }}
            - name: LEITWACHT_CE_CONTAINERD_NS
              value: {{ .Values.containerd.namespace | quote }}
            {{- if .Values.containerd.runnerPodNamespace }}
            - name: LEITWACHT_CE_RUNNER_POD_NAMESPACE
              value: {{ .Values.containerd.runnerPodNamespace | quote }}
            {{- end }}
            {{- end }}
            - name: LEITWACHT_CE_SCOPE_LABEL
              value: {{ .Values.scope.label | quote }}
            - name: LEITWACHT_CE_SCOPE_ENV
              value: {{ .Values.scope.env | quote }}
            - name: LEITWACHT_CE_DEFAULT_ACTION
              value: {{ .Values.defaultAction | quote }}
            - name: LEITWACHT_CE_UNKNOWN_PROJECT
              value: {{ .Values.unknownProject | default "enforce" | quote }}
            - name: LEITWACHT_CE_DNS_UPSTREAM
              value: {{ .Values.dnsUpstream | quote }}
            {{- if .Values.trustedCIDRs }}
            - name: LEITWACHT_CE_TRUSTED_CIDRS
              value: {{ join "," .Values.trustedCIDRs | quote }}
            {{- end }}
            - name: LEITWACHT_CE_HONEYPOT_ENABLED
              value: {{ .Values.honeypot.enabled | quote }}
            - name: LEITWACHT_CE_HONEYPOT_DIR
              value: {{ .Values.honeypot.dir | quote }}
            - name: LEITWACHT_CE_RECORD_ENV_NAMES
              value: {{ .Values.recordEnvNames | default false | quote }}
            - name: LEITWACHT_CE_STDOUT_ENABLED
              value: {{ .Values.sinks.stdout | quote }}
            - name: LEITWACHT_CE_PROM_ENABLED
              value: {{ .Values.sinks.prometheus.enabled | quote }}
            - name: LEITWACHT_CE_PROM_ADDR
              value: {{ .Values.sinks.prometheus.addr | quote }}
            {{- if .Values.sinks.webhook.url }}
            - name: LEITWACHT_CE_WEBHOOK_URL
              value: {{ .Values.sinks.webhook.url | quote }}
            - name: LEITWACHT_CE_WEBHOOK_TIMEOUT
              value: {{ .Values.sinks.webhook.timeout | quote }}
            {{- if .Values.sinks.webhook.auth }}
            - name: LEITWACHT_CE_WEBHOOK_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-ce.fullname" . }}-webhook
                  key: auth
            {{- end }}
            {{- end }}
            - name: LEITWACHT_CE_MAX_CONCURRENT
              value: {{ .Values.maxConcurrentEnforcers | quote }}
            - name: LEITWACHT_CE_EVENT_BUFFER
              value: {{ .Values.eventBuffer | quote }}
            - name: LEITWACHT_CE_NETNS_GRACE
              value: {{ .Values.netnsGrace | quote }}
            - name: LEITWACHT_CE_BUCKET_INTERVAL
              value: {{ .Values.bucketInterval | quote }}
            - name: LEITWACHT_CE_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HOSTNAME_OVERRIDE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # /healthz is served unconditionally on the metrics port —
          # disabling Prometheus only removes /metrics, not the probe
          # endpoint. Accept both ":9090" and "0.0.0.0:9090" forms by
          # splitting on ":" and taking the last segment.
          ports:
            - name: metrics
              containerPort: {{ .Values.sinks.prometheus.addr | splitList ":" | last | atoi }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: rules
              mountPath: /etc/leitwacht
              readOnly: true
            {{- if eq .Values.runtime "containerd" }}
            - name: containerd-sock
              mountPath: {{ .Values.containerd.socket }}
              readOnly: false
            {{- end }}
            - name: var-run
              mountPath: /var/run/leitwacht
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: {{ include "agent-ce.fullname" . }}-rules
        {{- if eq .Values.runtime "containerd" }}
        - name: containerd-sock
          hostPath:
            path: {{ .Values.containerd.socket }}
            type: Socket
        {{- end }}
        - name: var-run
          hostPath:
            path: /var/run/leitwacht
            type: DirectoryOrCreate
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
