{{- if and .Values.sinks.webhook.url .Values.sinks.webhook.auth -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-ce.fullname" . }}-webhook
  labels:
    {{- include "agent-ce.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ .Values.sinks.webhook.auth | quote }}
{{- end }}
