# leitwacht-agent-ce — default values.

image:
  repository: registry.gitlab.com/leitwacht/leitwacht-agent/agent-ce
  pullPolicy: IfNotPresent
  # Pin to a digest in production. The chart's appVersion is used when
  # tag is empty.
  tag: ""

imagePullSecrets: []

# rules.yaml content for the ConfigMap. The daemon hot-reloads when the
# ConfigMap is updated. See ce/SCHEMA.md for the schema.
rules: |
  schema_version: 1
  scopes:
    - name: default
      default_action: block
      rule_sets:
        "":
          - pattern: registry.gitlab.com
            pattern_type: domain
            action: allow
            ports: [443]
          - pattern: gitlab.com
            pattern_type: domain
            action: allow
            ports: [443]

# Container runtime — "containerd" (default) or "docker".
#
# leitwacht only watches containers carrying the GitLab Runner managed
# label `com.gitlab.gitlab-runner.managed=true`. If you spin up
# non-Runner workloads on the same node they are ignored — no events,
# no enforcement.
runtime: containerd

# Containerd-specific settings (ignored when runtime=docker).
containerd:
  socket: /run/containerd/containerd.sock
  namespace: k8s.io
  # K8S namespace filter for runner containers, comma-separated for multiple namespaces.
  runnerPodNamespace: ""

# Scope matching — sets the label / env that selects a YAML scope.
scope:
  label: leitwacht.eu/scope
  env: LEITWACHT_SCOPE

# Default action when no scope matches: block | audit | allow.
defaultAction: block

# What to do when a container's project doesn't match any scope:
#   enforce — synthesise a policy with defaultAction; full security
#             gauntlet runs; eBPF attaches and applies the action.
#             Pick this when an unmapped scope means "default-deny."
#   pass    — treat as unenrolled; DNS proxy attaches so the
#             leitwacht-init init container exits, but no security
#             checks run, no advisories fire. Pick this when an
#             unmapped scope means "out of scope, leave it alone."
unknownProject: enforce

# DNS upstreams the in-netns proxy forwards to. **Required** — there is
# no default, because defaulting to public resolvers would leak every CI
# job's queries to a third party and bypass cluster DNS. Set this to
# the IP[:port] of your cluster resolver:
#
#   - On K8s with CoreDNS, use the kube-dns Service ClusterIP. Find it
#     with: `kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'`
#   - On bare-metal Docker, use the host's recursive resolver
#     (typically the first nameserver in /etc/resolv.conf).
#
# A `helm install` without this set will fail at agent startup.
dnsUpstream: ""

# Trusted CIDRs that bypass enforcement and are not recorded. Intended for
# Docker/Podman executors, where service and helper containers sit on bridge
# networks. On Kubernetes leave this empty: do not list pod or service CIDRs,
# because block mode already drops cluster-internal addresses by default.
# Example: ["172.17.0.0/16"]
trustedCIDRs: []

# DNS search-list expansion suppression. "structural" (default): a query that
# is a search-list expansion of a public-looking domain under the cluster
# domain (for example registry.example.org.<ns>.svc.cluster.local) is checked
# against the cluster DNS; if it answers NXDOMAIN with no answers, the event is
# dropped and the resolver goes on to the real name. Anything else, and every
# expansion outside the cluster domain, is handled and recorded normally.
# Quote "off" to disable (an unquoted off is a YAML boolean, also accepted).
dnsExpansionSuppression: structural

# Per-netns DNS positive-answer cache, in entries. Only successful answers
# the proxy forwarded under an allow rule or in audit mode are cached (never
# denies, NXDOMAIN, SERVFAIL, or synthesized replies), for at most the
# answer's TTL (capped at 300s), and it is flushed on any policy change.
# Policy checks and event recording still run on every query. 0 disables.
dnsCacheSize: 1024

# Kubernetes cluster domain. Never derived from the container's search list.
clusterDomain: cluster.local

# Credwatch: BPF LSM hook that detects credential file access
# (/.ssh/id_rsa, /.aws/credentials, etc.) inside monitored containers.
credwatch:
  enabled: false
  # Comma-separated path suffixes to watch (deny + kill in enforce mode).
  # Defaults are baked into the binary; override only to add or remove paths.
  paths: ""
  # Comma-separated path suffixes that are REPORTED when opened but never
  # denied and never kill the container, even in enforce mode. Default:
  # /.docker/config.json,/.npmrc,/.netrc,/.pypirc (registry logins).
  # Beats `paths`. "" keeps the default; "-" disables the class (an
  # explicit empty list, so /.docker/config.json etc. are not reported).
  reportOnly: ""
  # Comma-separated path suffixes with no event and no enforcement at
  # all. Beats both `paths` and `reportOnly`. Default: none.
  exclude: ""

# Proc-mem: BPF LSM hook that blocks /proc/<pid>/mem reads by
# monitored containers.
procMem:
  enabled: false

# When true, attach env-var NAMES (never values) of the offending PID
# to each violation report. Useful for "what secrets could this process
# have exfiltrated?" forensics. Cost: one /proc/<pid>/environ read per
# unique PID per bucket flush. Note: CI_JOB_TOKEN is in every GitLab
# Runner job's env and will show up on every violation.
recordEnvNames: false

# Sinks.
#
# At least one of stdout / prometheus.enabled / webhook.url must be set
# — the daemon refuses to start otherwise (silent reports are worse than
# no enforcement).
sinks:
  stdout: true
  prometheus:
    enabled: true
    addr: ":9090"
  webhook:
    url: ""
    auth: ""
    timeout: 5s

# Concurrency tuning.
# eventBuffer sizes the watcher's container-event channel. If the
# leitwacht_ce_event_channel_depth gauge is persistently non-zero you
# are back-pressuring containerd's subscription — raise this and/or
# maxConcurrentEnforcers.
maxConcurrentEnforcers: 64
eventBuffer: 64
# How long a netns context survives after its last container detaches.
# K8s init-container patterns rely on this to keep audit-mode rules alive
# across init→build container boundaries. Set higher if you observe
# "netns context torn down after grace period" warnings paired with
# missed-attach failures.
netnsGrace: 30s
# Pre-attach freeze (Docker/Podman runtime only; never on containerd/K8s,
# which uses the leitwacht-initc gate). A container is frozen (cgroup v2 cgroup.freeze, runtime pause as fallback)
# from its start event until egress enforcement is attached, so it cannot
# open connections in the gap. This is the budget to confirm the freeze; a
# container that cannot be held or attached is killed in block mode and
# released with a warning in audit mode. "0s" disables the freeze.
# Note: the agent also kills block-mode jobs it cannot enforce, which
# includes hitting maxConcurrentEnforcers — size that limit for your peak
# parallel jobs per node.
freezeTimeout: 5s
bucketInterval: 5m

# BuildKit step attribution.
#
# When grpcAddr is set, the agent subscribes to a buildkitd Control
# gRPC endpoint and stamps each egress event with the BuildKit
# session ref + vertex digest + Dockerfile RUN string. Per-row CI
# routing requires the CI runner to inject
# `--build-arg LEITWACHT_CI_*=...` at buildx invocation time — see
# docs/BUILDKIT_PERSISTENT_K8S.md for the full setup.
#
# Empty grpcAddr disables the whole subsystem; the agent behaves
# exactly as it did before BuildKit attribution existed.
buildkit:
  # buildkitd Control gRPC address (tcp://host:port or unix:///path).
  # Make sure the buildkitd NetworkPolicy allows ingress on this
  # port from the agent's namespace.
  grpcAddr: ""

  # Cgroup parent paths to watch for RUN-container creates. Glob
  # patterns expand once at agent startup (one `*` per directory
  # level — Go stdlib filepath.Glob shape, `**` is NOT supported).
  # Typical K8s shape:
  #   - /sys/fs/cgroup/kubepods.slice/*/*/buildkit
  # Typical bare-metal Docker shape:
  #   - /sys/fs/cgroup/system.slice/docker-*.scope/buildkit
  cgroupPaths: []

  # When true, refuse Solve sessions whose FrontendAttrs lack any
  # of requiredAttrs. Refused sessions have their RUN cgroups
  # SIGKILLed at runc-create via cgroup.kill. Roll out in two
  # phases: start with false while wrapping pipelines, then flip
  # to true once unattributed builds have stopped appearing in
  # the metrics.
  requireCIMetadata: false

  # Egress mode for RUN steps: audit (default; record every
  # connection, drop nothing) | shadow (pass, record would_block) |
  # enforce (drop what the project's rules deny). Applies only to
  # scopes whose effective action is block. A RUN step that cannot be
  # tied to exactly one project is always audit.
  #
  # Limits of shadow/enforce until the build DNS proxy exists:
  #  - only IP/CIDR rules are enforced. Domain (fqdn) allow rules are NOT:
  #    the agent logs an Error once per policy version and flags rows
  #    fqdn_rules_inactive. Allow build destinations by address.
  #  - port 53 from a RUN step is allowed only to the agent's DNS upstream
  #    (dnsUpstream); any other resolver is dropped (enforce) or recorded
  #    as would_block (shadow), regardless of rules or trusted networks
  #    (the pin precedes the rules: an explicit deny on the upstream
  #    IP:53 is overridden). dnsUpstream must be the resolver buildkitd's
  #    RUN steps actually use (buildkitd's resolv.conf or [dns]),
  #    otherwise every build's DNS is flagged or dropped as a bypass.
  #  - needs Linux 5.10+ (cgroup_skb spin locks, map-in-map). The RUN-step
  #    cgroup level is found in the kernel from cgroupPaths; a layout that
  #    does not match runs in audit with run_level_mismatch on the rows.
  enforcement: audit

  # Opt in to the fail-closed kill switch: with requireCIMetadata or
  # denyVertexPatterns set, RUN cgroups that cannot be attributed are
  # SIGKILLed. Default false: they are flagged and left running. This
  # does NOT cover a definite deny-pattern match on a single exactly
  # linked vertex: that is explicit policy and always kills.
  killOnUnattributed: false

  # Plain CI env-var names (the agent adds the `build-arg:` prefix
  # internally). The default — just project_path — is the minimum
  # the server needs for routing.
  requiredAttrs:
    - LEITWACHT_CI_PROJECT_PATH

  # Opt out of the cgroup_skb attach at /sys/fs/cgroup/buildkit/<...>.
  # The session/vertex registry + watcher still run, but the agent
  # does NOT observe RUN-step egress, which disables per-RUN-step
  # enforcement of egress policy. Set true when the cgroup_skb
  # attach isn't supported in your kernel/runtime combo (cgroup v1,
  # exotic namespacing) and you'd rather degrade gracefully than
  # block agent startup.
  disableCgroupAttach: false

  # How long a BuildKit session that never reported completion (missed
  # event, crashed client) stays tracked after its last activity. Go
  # duration; empty keeps the agent default (6h).
  maxSessionAge: ""

  # Per-vertex kill-switch. Each list item is a Go regexp (RE2) that
  # the agent evaluates against each BuildKit vertex's Name (e.g.
  # "[stage 2/5] RUN apk add curl"). A match SIGKILLs the RUN
  # cgroup via cgroup.kill BEFORE any egress can happen — same
  # mechanism as requireCIMetadata. Server-distributed policy rules
  # with pattern_type=build_vertex+action=deny populate the same
  # kill-switch via the EE-side rule fetch; CE installs can pin a
  # static set here.
  #
  # Examples:
  #   - "^\\[.*\\] RUN npm install"        # block any "RUN npm install"
  #   - "curl https?://"                   # block curl-to-internet
  denyVertexPatterns: []

# Logging.
logLevel: info

# Pod / DaemonSet shape.
serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Optional. Set to "system-node-critical" on production clusters so the
# agent isn't preempted under memory pressure — a missing data plane is
# worse than a degraded node.
priorityClassName: ""

# Service exposing /metrics — only used when sinks.prometheus.enabled.
service:
  type: ClusterIP
  port: 9090
  annotations: {}
